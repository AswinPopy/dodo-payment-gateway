services:
  postgres:
    image: postgres:16
    container_name: dodo-postgres
    environment:
      POSTGRES_USER: dodo
      POSTGRES_PASSWORD: dodo
      POSTGRES_DB: dodo_payments
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodo -d dodo_payments"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mock-psp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-psp
    container_name: dodo-mock-psp
    environment:
      MOCK_PSP_ADDR: ":8081"
      INVOICE_WEBHOOK_URL: http://server:8080/webhooks/psp
      PSP_WEBHOOK_SECRET: whsec_mock_psp_dev
    ports:
      - "8081:8081"
    depends_on:
      server:
        condition: service_started

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: dodo-server
    environment:
      DATABASE_URL: postgres://dodo:dodo@postgres:5432/dodo_payments?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
      PSP_BASE_URL: http://mock-psp:8081
      PSP_WEBHOOK_SECRET: whsec_mock_psp_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
